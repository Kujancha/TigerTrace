[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiger-reid-loss-study"
version = "1.0.0"
description = "Reproducible ViT metric-learning loss comparisons for ATRW tiger re-identification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "timm==1.0.30",
  "pytorch-metric-learning==2.9.0",
  "tqdm>=4.66,<5",
  "numpy>=1.26,<3",
  "Pillow>=10,<14",
  "matplotlib>=3.8,<4",
]

[project.scripts]
tiger-reid = "tiger_reid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
